# The Windows desktop app: Trek-X.Y.Z-win-x64.exe, a per-user NSIS installer (no admin), with its
# .blockmap and latest.yml, the feed an installed Trek checks for updates. Built on windows-latest,
# signed with Azure Trusted Signing on a v* tag when the release environment has all seven AZURE_*
# secrets (then verified, down to every signature), installed silently into
# %LOCALAPPDATA%\Programs\Trek, smoke-tested there (the packaged Local server and app smokes), and
# uninstalled silently. Signing is optional: a tag with none of the secrets builds the installer
# unsigned, with a warning; a tag with only some of them fails, naming the missing ones. Called by
# release.yml; also by hand (Run workflow) to try a branch, which builds the same installer
# unsigned and uploads it to that run only.
#
# Two jobs, one set of steps (the YAML anchor &steps): the signing secrets are the `release`
# environment's, and that environment admits v* tags only, so a branch run cannot name it. `signed`
# names it and runs on a tag; `unsigned` names none and runs otherwise; the other one is skipped.
# The step "Decide whether to sign" sets SIGN (true only on a tag with all seven secrets), and the
# signing flags and signature checks follow SIGN, not the tag.
# A job of a reusable workflow that names an environment reads that environment's secrets itself
# (a caller cannot pass them), and its tag rule is checked against the caller's ref.
name: Windows app

on:
  workflow_call:
  workflow_dispatch:
  # TEMP: a new workflow can't be run by hand until it is on main. Revert before merging.
  push:
    branches: [feature/windows-desktop]

permissions:
  contents: read

jobs:
  signed:
    name: Trek installer (win-x64, signed)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    defaults: &defaults
      run:
        # Git Bash, so the steps read as on Linux (the signature checks are PowerShell's).
        shell: bash
    steps: &steps
      # Byte-exact checkouts, as ci.yml's Windows job.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            relay/package-lock.json
      # SIGN=true only on a tag with all seven secrets; none of them: unsigned, with a warning;
      # some of them: a misconfiguration, and the release stops.
      - name: Decide whether to sign
        env:
          HAS_TENANT: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_CLIENT: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
          HAS_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}
          HAS_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE != '' }}
          HAS_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER != '' }}
        run: |
          missing=()
          [ "$HAS_TENANT" = true ] || missing+=("AZURE_TENANT_ID")
          [ "$HAS_CLIENT" = true ] || missing+=("AZURE_CLIENT_ID")
          [ "$HAS_SECRET" = true ] || missing+=("AZURE_CLIENT_SECRET")
          [ "$HAS_ENDPOINT" = true ] || missing+=("AZURE_SIGNING_ENDPOINT (the Trusted Signing account's endpoint URL)")
          [ "$HAS_ACCOUNT" = true ] || missing+=("AZURE_SIGNING_ACCOUNT (the Trusted Signing account name)")
          [ "$HAS_PROFILE" = true ] || missing+=("AZURE_SIGNING_PROFILE (the certificate profile name)")
          [ "$HAS_PUBLISHER" = true ] || missing+=("AZURE_SIGNING_PUBLISHER (the certificate's CN, which the updater checks)")
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "SIGN=false" >> "$GITHUB_ENV"
            echo "::notice title=Unsigned build::Not a v* tag, so not signed (the release environment's secrets are for tags only); the signature checks are skipped."
          elif [ ${#missing[@]} -eq 7 ]; then
            echo "SIGN=false" >> "$GITHUB_ENV"
            echo "::warning title=Windows installer UNSIGNED::Windows installer built UNSIGNED: no Azure signing secrets in the release environment (docs/RELEASING.md)"
          elif [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Signing secrets incomplete::Some but not all of the Azure signing secrets are set in the release environment, so the installer is neither signed nor knowingly unsigned. Missing: ${missing[*]}. Set them all, or remove the rest. See docs/RELEASING.md."
            exit 1
          else
            echo "SIGN=true" >> "$GITHUB_ENV"
          fi
      # node-pty comes from its own Windows prebuild (ConPTY), nothing is compiled.
      - run: npm ci --no-audit --no-fund
      - name: Version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Build (npm run build)
        run: npm run build
      # electron-builder signs Trek.exe, every .exe and .dll beside it and every .exe, .dll and .node
      # under resources/app.asar.unpacked (signExts), the uninstaller, then the installer, each with
      # Invoke-TrustedSigning (it installs the TrustedSigning module itself; the AZURE_* credentials
      # are what the module's EnvironmentCredential reads). azureSignOptions is given here, not in
      # package.json, so a local or branch build stays unsigned without it; its publisherName also
      # goes into resources/app-update.yml, where electron-updater checks a downloaded update's signer
      # (an unsigned build has no publisherName there, so the updater checks nothing).
      # dist/win-unpacked, which the nsis target builds on the way, is kept for the checks below.
      - name: Package and sign
        if: env.SIGN == 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
        run: >-
          npx electron-builder --win nsis --x64 --publish never
          -c.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT"
          -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT"
          -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGNING_PROFILE"
          -c.win.azureSignOptions.publisherName="$AZURE_SIGNING_PUBLISHER"
      - name: Package (unsigned)
        if: env.SIGN != 'true'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify the installer, its feed, node-pty and the signatures
        shell: pwsh
        env:
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exeName = "Trek-$env:VERSION-win-x64.exe"
          $exe = "dist/$exeName"
          $app = 'dist/win-unpacked'
          function Fail($message) { Write-Output "::error::$message"; exit 1 }
          foreach ($f in @($exe, "$exe.blockmap", 'dist/latest.yml', "$app/Trek.exe")) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { Fail "$f is missing" }
          }
          # The feed names the installer an installed Trek downloads.
          $feed = Get-Content -Raw dist/latest.yml
          Write-Output $feed
          $named = [regex]::Escape($exeName)
          if ($feed -notmatch "(?m)^\s*(-\s*)?(url|path):\s*$named\s*$") { Fail "dist/latest.yml does not name $exeName" }
          # The updater's feed is built in (app-update.yml names the GitHub repository).
          $update = "$app/resources/app-update.yml"
          if (-not (Test-Path -LiteralPath $update)) { Fail "$update is missing: the publish config is missing" }
          if ((Get-Content -Raw $update) -notmatch '(?m)^repo: trek\r?$') { Fail 'app-update.yml does not name the trek repository' }
          # node-pty: ConPTY's prebuild for win32-x64, and no other platform's.
          $pty = "$app/resources/app.asar.unpacked/node_modules/node-pty"
          if (-not (Test-Path -LiteralPath "$pty/prebuilds/win32-x64/conpty.node")) { Fail "node-pty's prebuilds/win32-x64/conpty.node is missing" }
          $others = @(Get-ChildItem -Directory -Path "$pty/prebuilds" | Where-Object { $_.Name -like 'darwin-*' -or $_.Name -eq 'win32-arm64' })
          if ($others.Count -gt 0) { Fail "node-pty prebuilds for other platforms shipped: $($others.Name -join ', ')" }

          if ($env:SIGN -ne 'true') {
            Write-Output '::notice title=Unsigned build::Signature checks skipped (not signing this build).'
            exit 0
          }
          # What electron-builder signs carries Trek's certificate: the installer, and in the app
          # every .exe and .dll at its top (Electron's own, Microsoft's d3dcompiler_47.dll included:
          # signtool replaces their signature) and every .exe, .dll and .node under
          # app.asar.unpacked (node-pty's ConPTY and winpty files), and NSIS's resources\elevate.exe
          # when it is packed. Anything else of those kinds
          # (electron-builder does not walk the rest of the tree) needs a valid signature from
          # anyone. The uninstaller is checked once installed.
          $publisher = $env:AZURE_SIGNING_PUBLISHER
          $root = (Resolve-Path $app).Path
          $unpacked = Join-Path $root 'resources\app.asar.unpacked'
          $elevate = Join-Path $root 'resources\elevate.exe'
          $files = @(Get-ChildItem -Recurse -File -Path $root -Include *.exe, *.dll, *.node)
          $bad = @()
          foreach ($f in @((Get-Item -LiteralPath $exe)) + $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            $ours = ($f.DirectoryName -eq $root) -or $f.FullName.StartsWith("$unpacked\") -or ($f.FullName -eq $elevate) -or ($f.Name -eq $exeName)
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '(none)' }
            $ok = $sig.Status -eq 'Valid' -and (-not $ours -or $subject.Contains($publisher))
            $line = "$($sig.Status) $(if ($ours) { 'ours' } else { 'other' }) $($f.FullName) [$subject]"
            Write-Output $line
            if (-not $ok) { $bad += $line }
          }
          if ($bad.Count -gt 0) {
            Write-Output "::error::$($bad.Count) file(s) not signed as expected (ours: Valid and signed by $publisher; other: Valid):"
            $bad | ForEach-Object { Write-Output "  $_" }
            exit 1
          }
          Write-Output "$($files.Count + 1) files signed"
      # The installer's /S past Git Bash's path conversion (MSYS_NO_PATHCONV), or a native program
      # gets it as a path. A silent install does not start the app; the waits are for the files.
      - name: Install it silently
        run: |
          set -euo pipefail
          MSYS_NO_PATHCONV=1 "./dist/Trek-$VERSION-win-x64.exe" /S
          dir="$(cygpath -u "$LOCALAPPDATA")/Programs/Trek"
          for _ in $(seq 1 90); do [ -f "$dir/Trek.exe" ] && [ -f "$dir/Uninstall Trek.exe" ] && break; sleep 2; done
          test -f "$dir/Trek.exe" || { echo "::error::the installer did not put Trek.exe in $dir"; exit 1; }
          test -f "$dir/Uninstall Trek.exe" || { echo "::error::the installer did not put its uninstaller in $dir"; exit 1; }
          ls -l "$dir"
      - name: Verify the installed signatures
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Trek'
          $bad = 0
          foreach ($name in @('Trek.exe', 'Uninstall Trek.exe')) {
            $sig = Get-AuthenticodeSignature -LiteralPath (Join-Path $dir $name)
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '(none)' }
            Write-Output "$($sig.Status) $name [$subject]"
            if ($sig.Status -ne 'Valid' -or -not $subject.Contains($env:AZURE_SIGNING_PUBLISHER)) { Write-Output "::error::the installed $name is not signed by $env:AZURE_SIGNING_PUBLISHER"; $bad++ }
          }
          if ($bad -gt 0) { exit 1 }
      # The smokes join paths with /: a mixed path (C:/Users/...), which Node takes.
      - name: Packaged-app smokes (installed)
        run: |
          set -euo pipefail
          dir="$(cygpath -m "$LOCALAPPDATA")/Programs/Trek"
          node scripts/local-server-smoke.mjs --packaged "$dir"
          node scripts/local-app-smoke.mjs --packaged "$dir"
      # The uninstaller copies itself to a temp folder, starts that and returns: hence the wait.
      # Silent, it ends any process still running from the install folder without asking.
      - name: Uninstall it silently
        run: |
          set -euo pipefail
          dir="$(cygpath -u "$LOCALAPPDATA")/Programs/Trek"
          MSYS_NO_PATHCONV=1 "$dir/Uninstall Trek.exe" /S
          for _ in $(seq 1 90); do [ ! -f "$dir/Trek.exe" ] && [ ! -f "$dir/Uninstall Trek.exe" ] && break; sleep 2; done
          test ! -f "$dir/Trek.exe" || { echo "::error::Trek.exe is still in $dir after the uninstall"; exit 1; }
          test ! -f "$dir/Uninstall Trek.exe" || { echo "::error::the uninstaller is still in $dir"; exit 1; }
      # The three files in a folder of their own, as mac-app's: each lands at the top of the
      # artifact, and a missing one fails here by name.
      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p dist-release
          for f in "Trek-$VERSION-win-x64.exe" "Trek-$VERSION-win-x64.exe.blockmap" latest.yml; do
            test -f "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
            mv "dist/$f" dist-release/
          done
          ls -l dist-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  unsigned:
    name: Trek installer (win-x64, unsigned)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults: *defaults
    steps: *steps
