# Release: a tag `vX.Y.Z` (the product version: package.json, server/ and relay/ must all say X.Y.Z,
# see scripts/set-version.mjs) builds every artifact, runs the gate, and opens a DRAFT GitHub Release.
# Nothing is published until someone publishes the draft. See docs/RELEASING.md.
#
#   version      the tag matches the three package.json versions
#   ci           ci.yml (typecheck, unit tests, build, Node smokes, the phone's export)   ┐ gate
#   macos-smokes macos-smokes.yml (the Electron smokes, macOS and Linux, one at a time)   ┘
#   mac-app      Trek-X.Y.Z-arm64.dmg: the app signed (Developer ID), hardened runtime, notarized
#                and stapled, and the dmg notarized and stapled too; verified, then the
#                packaged-app smokes run against it. It and server-mac are the only jobs that use
#                the Apple signing secrets: they live in the `release` environment (limited to v*
#                tags), not the repository, as the Windows ones (windows-app, server-win) do. `release` names that environment too, for the key
#                that signs SHA256SUMS.
#                Also Trek-X.Y.Z-arm64.zip (+ .blockmap) and latest-mac.yml, the app updater's
#                download and feed.
#   linux-app    linux-app.yml: Trek-X.Y.Z-linux-<arch>.deb on a native runner per arch, verified,
#                installed with apt and smoke-tested under xvfb; plus latest-linux.yml /
#                latest-linux-arm64.yml
#   windows-app  windows-app.yml: Trek-X.Y.Z-win-x64.exe, the per-user NSIS installer, signed with
#                Azure Trusted Signing (the `release` environment's AZURE_* secrets), verified,
#                installed silently, smoke-tested and uninstalled; plus its .blockmap and latest.yml
#   server       trek-server-X.Y.Z-linux-<arch>.tar.gz on a native runner for each arch, unpacked
#                and run (scripts/server-tarball-smoke.mjs)
#   server-win   trek-server-X.Y.Z-win32-x64.zip on Windows the same way, its bin\trek-server.ps1
#                signed with Azure Trusted Signing (the .cmd cannot be signed, and nothing in it is
#                an .exe SmartScreen checks); it names the `release` environment for that
#   server-mac   trek-server-X.Y.Z-darwin-<arch>.tar.gz the same way, with node-pty's pty.node and
#                spawn-helper signed (Developer ID, hardened runtime) and notarized, the smoke
#                unpacking it quarantined as a browser download is (--notarized)
#   relay        trek-relay-X.Y.Z.cjs (+ .sha256)
#   release      SHA256SUMS over everything, SHA256SUMS.sig (its signature, for trek-server update)
#                when the signing key is set up, then `gh release create --draft` (a re-run that
#                finds the draft already there uploads into it with --clobber instead)
#
# Every job waits for `version`, so a malformed tag stops the run early. The builds then run
# beside the gate; only `release` waits for all of it.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  version:
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: v
        name: The tag is the version of the app, trek-server and trek-relay
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node scripts/set-version.mjs --check "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case $version in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

  ci:
    name: 'Gate: CI'
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  macos-smokes:
    name: 'Gate: Electron smokes'
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/macos-smokes.yml

  mac-app:
    name: Trek.app (signed, notarized)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    # The signing and notarization secrets are the `release` environment's (docs/RELEASING.md):
    # only jobs that name it, on a v* tag it allows, can read them (this one, server-mac, and
    # release for the update signing key).
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Signed now, or not at all: a release never ships an unsigned app.
      - name: Signing and notarization secrets are set
        env:
          HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          HAS_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
          HAS_ANY_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' || secrets.APPLE_API_KEY_ID != '' || secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          missing=()
          [ "$HAS_CSC_LINK" = true ] || missing+=("CSC_LINK (the Developer ID Application certificate, .p12, base64)")
          [ "$HAS_CSC_KEY_PASSWORD" = true ] || missing+=("CSC_KEY_PASSWORD (the .p12's password)")
          if [ "$HAS_API_KEY" != true ] && [ "$HAS_APPLE_ID" != true ]; then
            if [ "$HAS_ANY_API_KEY" = true ]; then
              missing+=("all three of APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER (only some are set)")
            else
              missing+=("APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER (App Store Connect API key; or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID)")
            fi
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Release not signed::The release builds a signed, notarized Trek.app and refuses to ship an unsigned one. Missing secrets in the release environment: ${missing[*]}. See docs/RELEASING.md."
            exit 1
          fi
          if [ "$HAS_API_KEY" = true ]; then echo "Notarizing with the App Store Connect API key"; else echo "Notarizing with the Apple ID"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            relay/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build (npm run build)
        run: npm run build
      # electron-builder: rebuilds node-pty for Electron, signs every Mach-O in the app (Electron's
      # helpers and frameworks, node-pty's pty.node and spawn-helper in app.asar.unpacked) with the
      # hardened runtime and build/entitlements.mac*.plist, notarizes the app and staples it, then
      # makes the dmg. The bundled trek-server (out/server, JavaScript inside app.asar) runs on the
      # signed Electron binary (ELECTRON_RUN_AS_NODE), so it has nothing of its own to sign.
      # Then the dmg itself is notarized and stapled (notarytool, the same credentials), so a
      # downloaded dmg opens without Gatekeeper going online. The dmg is not signed: electron-builder
      # advises against it (dmg.sign), and the stapled ticket is what Gatekeeper checks.
      - name: Package, sign and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The signing keychain, the notary credentials and notarize(), removed however the step ends.
          source scripts/macos-signing.sh
          npx electron-builder --mac --arm64 --publish never

          dmg="dist/Trek-$VERSION-arm64.dmg"
          notarize "$dmg"
          xcrun stapler staple "$dmg"
      - name: Verify the signature, hardened runtime, notarization and node-pty
        run: |
          set -euo pipefail
          app=dist/mac-arm64/Trek.app
          dmg="dist/Trek-$VERSION-arm64.dmg"
          test -d "$app" && test -f "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Each output is captured, then grepped from a here-string: `cmd | grep -q` under pipefail
          # can fail when grep exits at its first match and cmd gets SIGPIPE.
          info=$(codesign -dv --verbose=4 "$app" 2>&1)
          grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp|CodeDirectory)' <<<"$info"
          grep -q '^Authority=Developer ID Application' <<<"$info" || { echo "::error::Trek.app is not signed with a Developer ID Application certificate"; exit 1; }
          grep -Eq 'flags=.*runtime' <<<"$info" || { echo "::error::Trek.app is not signed with the hardened runtime"; exit 1; }
          entitlements=$(codesign -d --entitlements - "$app" 2>/dev/null)
          grep -q 'com.apple.security.automation.apple-events' <<<"$entitlements" || { echo "::error::Trek.app lacks its entitlements"; exit 1; }
          # Every Mach-O under app.asar.unpacked (node-pty): signed, hardened, and spawn-helper executable.
          unpacked="$app/Contents/Resources/app.asar.unpacked"
          found=0
          while IFS= read -r f; do
            kind=$(file -b "$f")
            if grep -q Mach-O <<<"$kind"; then
              found=$((found + 1))
              codesign --verify --strict "$f"
              sig=$(codesign -dv "$f" 2>&1)
              grep -Eq 'flags=.*runtime' <<<"$sig" || { echo "::error::$f is not signed with the hardened runtime"; exit 1; }
              case $f in */spawn-helper) [ -x "$f" ] || { echo "::error::$f is not executable"; exit 1; } ;; esac
              echo "signed: ${f#"$unpacked/"}"
            fi
          done < <(find "$unpacked" -type f)
          [ "$found" -gt 0 ] || { echo "::error::no native files under app.asar.unpacked: node-pty is missing"; exit 1; }
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          # The dmg carries its own notarization ticket.
          xcrun stapler validate "$dmg"
          # The app inside the dmg is the stapled one.
          mnt="$RUNNER_TEMP/trek-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          codesign --verify --deep --strict "$mnt/Trek.app"
          xcrun stapler validate "$mnt/Trek.app"
          # The updater's feed: built in (app-update.yml names the GitHub repository).
          feed="$app/Contents/Resources/app-update.yml"
          test -f "$feed" || { echo "::error::Trek.app has no app-update.yml: the publish config is missing"; exit 1; }
          grep -q '^repo: trek$' "$feed" || { echo "::error::app-update.yml does not name the trek repository"; exit 1; }
          # The zip is what an installed Trek downloads to update itself: the same signed, stapled app.
          zip="dist/Trek-$VERSION-arm64.zip"
          test -f "$zip" || { echo "::error::$zip is missing: the zip target was not built"; exit 1; }
          # Its block map lets a later update download only the blocks that changed.
          test -f "$zip.blockmap" || { echo "::error::$zip.blockmap is missing"; exit 1; }
          unzipped="$RUNNER_TEMP/trek-zip"
          rm -rf "$unzipped" && mkdir -p "$unzipped"
          ditto -x -k "$zip" "$unzipped"
          codesign --verify --deep --strict "$unzipped/Trek.app"
          xcrun stapler validate "$unzipped/Trek.app"
          spctl --assess --type execute --verbose=4 "$unzipped/Trek.app"
          # latest-mac.yml: the dmg was stapled after electron-builder wrote it, so its entry is
          # stale; drop it, and check the zip against what is left.
          node scripts/latest-mac-yml.mjs dist/latest-mac.yml
      # smoke:packaged without its dist:dir: the signed app's own binary runs the bundled Local
      # server (node-pty from app.asar.unpacked), then the app itself is driven.
      - name: Packaged-app smokes
        run: |
          node scripts/local-server-smoke.mjs --packaged dist/mac-arm64/Trek.app
          node scripts/local-app-smoke.mjs --packaged dist/mac-arm64/Trek.app
      # The four files in a folder of their own, uploaded with one pattern as the relay's are: each
      # lands at the top of the artifact, and a missing one fails here by name.
      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p dist-release
          for f in "Trek-$VERSION-arm64.dmg" "Trek-$VERSION-arm64.zip" "Trek-$VERSION-arm64.zip.blockmap" latest-mac.yml; do
            test -f "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
            mv "dist/$f" dist-release/
          done
          ls -l dist-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  linux-app:
    name: Trek .deb
    needs: version
    uses: ./.github/workflows/linux-app.yml
    permissions:
      contents: read

  # Its signing job names the `release` environment itself and so reads that environment's AZURE_*
  # secrets (environment secrets cannot be passed to a reusable workflow; inherit passes the
  # repository's). On this tag run it is windows-app.yml's `signed` job that runs.
  windows-app:
    name: Trek installer
    needs: version
    uses: ./.github/workflows/windows-app.yml
    secrets: inherit
    permissions:
      contents: read

  server:
    name: trek-server ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35): node-pty compiled there runs on older distros than 24.04's.
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            relay/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the web client and the server
        run: |
          npm run build:web
          npm --prefix server run build
      - name: Package
        run: |
          node scripts/package-server.mjs --out dist-release
          test -f "dist-release/trek-server-$VERSION-${{ matrix.target }}.tar.gz"
      - name: Unpack and run it
        run: node scripts/server-tarball-smoke.mjs "dist-release/trek-server-$VERSION-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.target }}
          path: dist-release/trek-server-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The Windows zip: node-pty's own Windows prebuild (ConPTY + winpty), zipped by Windows' bsdtar,
  # with bin\trek-server.ps1 signed (Azure Trusted Signing) before it is zipped
  # (package-server.mjs --sign-azure), so PowerShell's AllSigned and RemoteSigned policies can
  # check it. Its own job, not a leg of `server`: it names the `release` environment for the
  # AZURE_* secrets, and the Linux legs need none.
  server-win:
    name: trek-server win32-x64 (launcher signed)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        # Git Bash, so the steps read as server's (the signature check is PowerShell's).
        shell: bash
    steps:
      # Signed now, or not at all, as the installer (windows-app.yml).
      - name: Signing secrets are set
        env:
          HAS_TENANT: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_CLIENT: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
          HAS_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}
          HAS_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE != '' }}
          HAS_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER != '' }}
        run: |
          missing=()
          [ "$HAS_TENANT" = true ] || missing+=("AZURE_TENANT_ID")
          [ "$HAS_CLIENT" = true ] || missing+=("AZURE_CLIENT_ID")
          [ "$HAS_SECRET" = true ] || missing+=("AZURE_CLIENT_SECRET")
          [ "$HAS_ENDPOINT" = true ] || missing+=("AZURE_SIGNING_ENDPOINT")
          [ "$HAS_ACCOUNT" = true ] || missing+=("AZURE_SIGNING_ACCOUNT")
          [ "$HAS_PROFILE" = true ] || missing+=("AZURE_SIGNING_PROFILE")
          [ "$HAS_PUBLISHER" = true ] || missing+=("AZURE_SIGNING_PUBLISHER")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Release not signed::The Windows trek-server zip carries a signed PowerShell launcher, and the release refuses to ship it unsigned. Missing secrets in the release environment: ${missing[*]}. See docs/RELEASING.md."
            exit 1
          fi
      # Byte-exact checkouts, as ci.yml's Windows job: the launchers and web client are packaged as
      # committed (.gitattributes fixes the line endings that matter), not as core.autocrlf rewrites them.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            relay/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the web client and the server
        run: |
          npm run build:web
          npm --prefix server run build
      - name: Package, signing the PowerShell launcher
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
        run: |
          node scripts/package-server.mjs --out dist-release --sign-azure
          test -f "dist-release/trek-server-$VERSION-win32-x64.zip"
      # The zip holds the signed launcher (package-server.mjs checked it before zipping).
      - name: The zipped launcher is signed
        shell: pwsh
        env:
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $x = Join-Path $env:RUNNER_TEMP 'trek-server-ps1'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $x
          New-Item -ItemType Directory -Path $x | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf "dist-release/trek-server-$env:VERSION-win32-x64.zip" -C $x
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ps1 = Join-Path $x "trek-server-$env:VERSION-win32-x64\bin\trek-server.ps1"
          $sig = Get-AuthenticodeSignature -LiteralPath $ps1
          $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '(none)' }
          Write-Output "$($sig.Status) bin\trek-server.ps1 [$subject]"
          if ($sig.Status -ne 'Valid' -or -not $subject.Contains($env:AZURE_SIGNING_PUBLISHER)) {
            Write-Output "::error::the zip's bin\trek-server.ps1 is not signed by $env:AZURE_SIGNING_PUBLISHER"
            exit 1
          }
      - name: Unpack and run it
        run: node scripts/server-tarball-smoke.mjs "dist-release/trek-server-$VERSION-win32-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-win32-x64
          path: dist-release/trek-server-${{ env.VERSION }}-win32-x64.zip
          if-no-files-found: error
          retention-days: 14

  # The macOS tarballs: node-pty's pty.node and spawn-helper signed (Developer ID, hardened runtime)
  # and notarized. A browser download is quarantined and tar passes that on to every file it
  # unpacks; macOS then loads a quarantined native module only if it is notarized ("library load
  # disallowed by system policy" otherwise). A bare Mach-O cannot have a ticket stapled to it, so
  # Gatekeeper looks the ticket up online the first time it loads it. The smoke unpacks the
  # tarball quarantined (--notarized), so its pty check is Gatekeeper's.
  server-mac:
    name: trek-server ${{ matrix.target }} (signed, notarized)
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The signing secrets, as for mac-app.
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-latest }
          - { target: darwin-x64, runner: macos-15-intel }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      # Signed now, or not at all: a release never ships a tarball macOS refuses to load once downloaded.
      - name: Signing and notarization secrets are set
        env:
          HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          HAS_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
          HAS_ANY_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' || secrets.APPLE_API_KEY_ID != '' || secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          missing=()
          [ "$HAS_CSC_LINK" = true ] || missing+=("CSC_LINK (the Developer ID Application certificate, .p12, base64)")
          [ "$HAS_CSC_KEY_PASSWORD" = true ] || missing+=("CSC_KEY_PASSWORD (the .p12's password)")
          if [ "$HAS_API_KEY" != true ] && [ "$HAS_APPLE_ID" != true ]; then
            if [ "$HAS_ANY_API_KEY" = true ]; then
              missing+=("all three of APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER (only some are set)")
            else
              missing+=("APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER (App Store Connect API key; or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID)")
            fi
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Release not signed::The macOS trek-server tarballs carry a signed, notarized node-pty, and the release refuses to ship them unsigned. Missing secrets in the release environment: ${missing[*]}. See docs/RELEASING.md."
            exit 1
          fi
          if [ "$HAS_API_KEY" = true ]; then echo "Notarizing with the App Store Connect API key"; else echo "Notarizing with the Apple ID"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            relay/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the web client and the server
        run: |
          npm run build:web
          npm --prefix server run build
      - name: Package, sign and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The signing keychain, the notary credentials and notarize(), removed however the step ends.
          source scripts/macos-signing.sh
          node scripts/package-server.mjs --out dist-release --sign 'Developer ID Application'
          tarball="dist-release/trek-server-$VERSION-${{ matrix.target }}.tar.gz"
          test -f "$tarball"
          # The notary takes a zip; its ticket is for the signed files (their code hashes), so the
          # same files in the tarball pass. node-pty's native folder holds just the two of them.
          unpacked="$RUNNER_TEMP/trek-server-notarize"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          tar -xzf "$tarball" -C "$unpacked"
          native=$(dirname "$(find "$unpacked" -path '*/node-pty/*' -name pty.node)")
          ditto -c -k --keepParent "$native" "$RUNNER_TEMP/node-pty-native.zip"
          notarize "$RUNNER_TEMP/node-pty-native.zip"
      - name: Unpack it quarantined and run it
        run: node scripts/server-tarball-smoke.mjs --notarized "dist-release/trek-server-$VERSION-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.target }}
          path: dist-release/trek-server-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  relay:
    name: trek-relay
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: relay/package-lock.json
      # The relay has no runtime dependencies: only its own devDependencies (esbuild) are needed.
      - run: npm --prefix relay ci --no-audit --no-fund
      - name: Build and check
        run: |
          npm run build:relay
          mkdir -p dist-release
          out="trek-relay-$VERSION.cjs"
          cp relay/dist/trek-relay.cjs "dist-release/$out"
          printed=$(node "dist-release/$out" version)
          [ "$printed" = "trek-relay $VERSION" ] || { echo "::error::$out says \"$printed\", not trek-relay $VERSION"; exit 1; }
          (cd dist-release && sha256sum "$out" > "$out.sha256" && cat "$out.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay
          path: dist-release/trek-relay-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    needs: [version, ci, macos-smokes, mac-app, linux-app, windows-app, server, server-win, server-mac, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The key that signs SHA256SUMS is the `release` environment's too (docs/RELEASING.md): only
    # the signing step below is handed it.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      # Only what signing needs: the script and the public keys it checks its signature against
      # (neither imports anything else). Before the download, so artifacts/ is never in its way.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/sign-sums.mjs
            server/src/update/keys.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: artifacts
        run: |
          expected=("Trek-$VERSION-arm64.dmg" "Trek-$VERSION-arm64.zip" "Trek-$VERSION-arm64.zip.blockmap" "latest-mac.yml" "trek-relay-$VERSION.cjs" "trek-relay-$VERSION.cjs.sha256")
          for a in x64 arm64; do expected+=("Trek-$VERSION-linux-$a.deb"); done
          expected+=("latest-linux.yml" "latest-linux-arm64.yml")
          expected+=("Trek-$VERSION-win-x64.exe" "Trek-$VERSION-win-x64.exe.blockmap" "latest.yml")
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do expected+=("trek-server-$VERSION-$t.tar.gz"); done
          expected+=("trek-server-$VERSION-win32-x64.zip")
          for f in "${expected[@]}"; do [ -f "$f" ] || { echo "::error::missing artifact $f"; exit 1; }; done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # What `trek-server update` trusts: SHA256SUMS signed with the release environment's Ed25519
      # key, checked against the public keys committed in server/src/update/keys.ts. With neither
      # set up yet it warns and signs nothing; with one and not the other, the release stops.
      # SHA256SUMS.sig is written after SHA256SUMS, so it is not listed in it.
      # --experimental-strip-types: the script imports keys.ts. Node 22.18 and later strip types
      # anyway (the flag then does nothing); this makes an older 22.x do the same.
      - name: Sign SHA256SUMS
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node --experimental-strip-types scripts/sign-sums.mjs sign artifacts/SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          **Trek $VERSION**

          - \`Trek-$VERSION-arm64.dmg\`: the desktop app for Apple silicon Macs (signed and notarized).
          - \`Trek-$VERSION-arm64.zip\`, its \`.blockmap\` and \`latest-mac.yml\`: what an installed Trek downloads to update itself (Trek → Check for Updates…). Not for installing by hand.
          - \`Trek-$VERSION-linux-x64.deb\`, \`Trek-$VERSION-linux-arm64.deb\`: the desktop app for Ubuntu 22.04+ and Debian 12+. Install with \`sudo apt install ./Trek-$VERSION-linux-<arch>.deb\` (see docs/LINUX.md). \`latest-linux*.yml\` is what an installed Trek checks for a newer version.
          - \`Trek-$VERSION-win-x64.exe\`: the desktop app for Windows 10 and 11 (x64), signed; installs for your user (no admin) and updates itself. Its \`.blockmap\` and \`latest.yml\` are what an installed Trek downloads to update.
          - \`trek-server-$VERSION-<os>-<arch>.tar.gz\`: trek-server for macOS and Linux (x64, arm64); needs Node.js 22 or later. Unpack it and run \`bin/trek-server\` (see its README.md).
          - \`trek-server-$VERSION-win32-x64.zip\`: trek-server for Windows (x64); needs Node.js 22 or later. Unzip it and run \`bin\\trek-server\` (see its README.md and docs/WINDOWS.md).
          - \`trek-relay-$VERSION.cjs\`: the push relay (\`node trek-relay-$VERSION.cjs start --config <file>\`); see relay/README.md.
          - \`SHA256SUMS\`: \`sha256sum -c SHA256SUMS\` (\`shasum -a 256 -c SHA256SUMS\` on macOS). \`SHA256SUMS.sig\`, when present, is its Ed25519 signature: what \`trek-server update\` verifies before it installs a release.

          The phone app is built and shipped with EAS, not here.
          EOF
          # A re-run (the draft was made, then a later step or the run failed): upload into the
          # existing draft, replacing same-named assets. A published release is never touched.
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is already published: not replacing its assets"
              exit 1
            fi
            echo "The draft release $TAG exists: uploading into it (--clobber)"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*
            exit 0
          fi
          # notes.md comes first in the release notes, then GitHub's generated ones.
          flags=(--draft --verify-tag --title "Trek $VERSION" --notes-file notes.md --generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" artifacts/*
