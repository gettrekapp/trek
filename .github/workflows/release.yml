# Release: a tag `vX.Y.Z` (the product version: package.json, server/ and relay/ must all say X.Y.Z,
# see scripts/set-version.mjs) builds every artifact, runs the gate, and opens a DRAFT GitHub Release.
# Nothing is published until someone publishes the draft. See docs/RELEASING.md.
#
#   version      the tag matches the three package.json versions
#   ci           ci.yml (typecheck, unit tests, build, Node smokes, the phone's export)   ┐ gate
#   macos-smokes macos-smokes.yml (the Electron smokes, one at a time)                    ┘
#   mac-app      Trek-X.Y.Z-arm64.dmg: the app signed (Developer ID), hardened runtime, notarized
#                and stapled, and the dmg notarized and stapled too; verified, then the
#                packaged-app smokes run against it. The only job with the signing secrets: they
#                live in the `release` environment (limited to v* tags), not the repository.
#   server       trek-server-X.Y.Z-<os>-<arch>.tar.gz on a native runner for each platform,
#                each unpacked and run (scripts/server-tarball-smoke.mjs)
#   relay        trek-relay-X.Y.Z.cjs (+ .sha256)
#   release      SHA256SUMS over everything, then `gh release create --draft` (a re-run that finds
#                the draft already there uploads into it with --clobber instead)
#
# Every job waits for `version`, so a malformed tag stops the run early. The builds then run
# beside the gate; only `release` waits for all of it.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  version:
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: v
        name: The tag is the version of the app, trek-server and trek-relay
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node scripts/set-version.mjs --check "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case $version in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

  ci:
    name: 'Gate: CI'
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  macos-smokes:
    name: 'Gate: macOS smokes'
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/macos-smokes.yml

  mac-app:
    name: Trek.app (signed, notarized)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    # The signing and notarization secrets are the `release` environment's (docs/RELEASING.md):
    # only this job, on a v* tag the environment allows, can read them.
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Signed now, or not at all: a release never ships an unsigned app.
      - name: Signing and notarization secrets are set
        env:
          HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          HAS_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
          HAS_ANY_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' || secrets.APPLE_API_KEY_ID != '' || secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          missing=()
          [ "$HAS_CSC_LINK" = true ] || missing+=("CSC_LINK (the Developer ID Application certificate, .p12, base64)")
          [ "$HAS_CSC_KEY_PASSWORD" = true ] || missing+=("CSC_KEY_PASSWORD (the .p12's password)")
          if [ "$HAS_API_KEY" != true ] && [ "$HAS_APPLE_ID" != true ]; then
            if [ "$HAS_ANY_API_KEY" = true ]; then
              missing+=("all three of APPLE_API_KEY_P8, APPLE_API_KEY_ID and APPLE_API_ISSUER (only some are set)")
            else
              missing+=("APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER (App Store Connect API key; or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID)")
            fi
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Release not signed::The release builds a signed, notarized Trek.app and refuses to ship an unsigned one. Missing secrets in the release environment: ${missing[*]}. See docs/RELEASING.md."
            exit 1
          fi
          if [ "$HAS_API_KEY" = true ]; then echo "Notarizing with the App Store Connect API key"; else echo "Notarizing with the Apple ID"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            relay/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build (npm run build)
        run: npm run build
      # electron-builder: rebuilds node-pty for Electron, signs every Mach-O in the app (Electron's
      # helpers and frameworks, node-pty's pty.node and spawn-helper in app.asar.unpacked) with the
      # hardened runtime and build/entitlements.mac*.plist, notarizes the app and staples it, then
      # makes the dmg. The bundled trek-server (out/server, JavaScript inside app.asar) runs on the
      # signed Electron binary (ELECTRON_RUN_AS_NODE), so it has nothing of its own to sign.
      # Then the dmg itself is notarized and stapled (notarytool, the same credentials), so a
      # downloaded dmg opens without Gatekeeper going online. The dmg is not signed: electron-builder
      # advises against it (dmg.sign), and the stapled ticket is what Gatekeeper checks.
      - name: Package, sign and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/trek-signing.keychain-db"
          p12="$RUNNER_TEMP/trek-signing.p12"
          # Removed however this step ends, electron-builder or the notary failing included.
          trap 'rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$p12"; security delete-keychain "$kc" 2>/dev/null || true' EXIT

          # The certificate goes into a keychain made here, not through CSC_LINK: electron-builder
          # 26.15.3 runs `security set-key-partition-list -k <the .p12's password>` on its own temp
          # keychain, whose password is a different, random one, and fails ("SecKeychainUnlock: The
          # user name or passphrase you entered is not correct"). With CSC_LINK unset it signs from
          # the keychain named by CSC_KEYCHAIN.
          kcpass=$(openssl rand -base64 32)
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          (umask 077; printf '%s' "$CSC_LINK" | base64 --decode > "$p12")
          security import "$p12" -k "$kc" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" > /dev/null
          # On the search list too, so codesign finds the identity's certificate chain.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identities=$(security find-identity -v -p codesigning "$kc")
          case $identities in *'Developer ID Application'*) ;; *) echo "::error title=No signing identity::CSC_LINK holds no Developer ID Application identity"; exit 1 ;; esac
          unset CSC_LINK CSC_KEY_PASSWORD kcpass
          export CSC_KEYCHAIN="$kc"

          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            # The API key wins: electron-builder would use the Apple ID first if both were set.
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
            export APPLE_API_KEY="$key"
            notary=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          else
            notary=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          unset APPLE_API_KEY_P8
          npx electron-builder --mac --arm64 --publish never

          dmg="dist/Trek-$VERSION-arm64.dmg"
          # Judged by the status it reports, not its exit code; a failure prints the notary's log.
          result=$(xcrun notarytool submit "$dmg" "${notary[@]}" --wait --timeout 45m --output-format json) || true
          echo "$result"
          status=$(node -e 'try { process.stdout.write(String(JSON.parse(process.argv[1]).status)) } catch { process.stdout.write("no answer") }' "$result")
          if [ "$status" != Accepted ]; then
            id=$(node -e 'try { process.stdout.write(String(JSON.parse(process.argv[1]).id ?? "")) } catch {}' "$result")
            [ -z "$id" ] || xcrun notarytool log "$id" "${notary[@]}" || true
            echo "::error title=dmg not notarized::The notary service says \"$status\" for $dmg (its log is above)"
            exit 1
          fi
          xcrun stapler staple "$dmg"
      - name: Verify the signature, hardened runtime, notarization and node-pty
        run: |
          set -euo pipefail
          app=dist/mac-arm64/Trek.app
          dmg="dist/Trek-$VERSION-arm64.dmg"
          test -d "$app" && test -f "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Each output is captured, then grepped from a here-string: `cmd | grep -q` under pipefail
          # can fail when grep exits at its first match and cmd gets SIGPIPE.
          info=$(codesign -dv --verbose=4 "$app" 2>&1)
          grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp|CodeDirectory)' <<<"$info"
          grep -q '^Authority=Developer ID Application' <<<"$info" || { echo "::error::Trek.app is not signed with a Developer ID Application certificate"; exit 1; }
          grep -Eq 'flags=.*runtime' <<<"$info" || { echo "::error::Trek.app is not signed with the hardened runtime"; exit 1; }
          entitlements=$(codesign -d --entitlements - "$app" 2>/dev/null)
          grep -q 'com.apple.security.automation.apple-events' <<<"$entitlements" || { echo "::error::Trek.app lacks its entitlements"; exit 1; }
          # Every Mach-O under app.asar.unpacked (node-pty): signed, hardened, and spawn-helper executable.
          unpacked="$app/Contents/Resources/app.asar.unpacked"
          found=0
          while IFS= read -r f; do
            kind=$(file -b "$f")
            if grep -q Mach-O <<<"$kind"; then
              found=$((found + 1))
              codesign --verify --strict "$f"
              sig=$(codesign -dv "$f" 2>&1)
              grep -Eq 'flags=.*runtime' <<<"$sig" || { echo "::error::$f is not signed with the hardened runtime"; exit 1; }
              case $f in */spawn-helper) [ -x "$f" ] || { echo "::error::$f is not executable"; exit 1; } ;; esac
              echo "signed: ${f#"$unpacked/"}"
            fi
          done < <(find "$unpacked" -type f)
          [ "$found" -gt 0 ] || { echo "::error::no native files under app.asar.unpacked: node-pty is missing"; exit 1; }
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          # The dmg carries its own notarization ticket.
          xcrun stapler validate "$dmg"
          # The app inside the dmg is the stapled one.
          mnt="$RUNNER_TEMP/trek-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          codesign --verify --deep --strict "$mnt/Trek.app"
          xcrun stapler validate "$mnt/Trek.app"
      # smoke:packaged without its dist:dir: the signed app's own binary runs the bundled Local
      # server (node-pty from app.asar.unpacked), then the app itself is driven.
      - name: Packaged-app smokes
        run: |
          node scripts/local-server-smoke.mjs --packaged dist/mac-arm64/Trek.app
          node scripts/local-app-smoke.mjs --packaged dist/mac-arm64/Trek.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app
          path: dist/Trek-${{ env.VERSION }}-arm64.dmg
          if-no-files-found: error
          retention-days: 14

  server:
    name: trek-server ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-latest }
          - { target: darwin-x64, runner: macos-15-intel }
          # Ubuntu 22.04 (glibc 2.35): node-pty compiled there runs on older distros than 24.04's.
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            relay/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the web client and the server
        run: |
          npm run build:web
          npm --prefix server run build
      - name: Package
        run: |
          node scripts/package-server.mjs --out dist-release
          test -f "dist-release/trek-server-$VERSION-${{ matrix.target }}.tar.gz"
      - name: Unpack and run it
        run: node scripts/server-tarball-smoke.mjs "dist-release/trek-server-$VERSION-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.target }}
          path: dist-release/trek-server-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  relay:
    name: trek-relay
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: relay/package-lock.json
      # The relay has no runtime dependencies: only its own devDependencies (esbuild) are needed.
      - run: npm --prefix relay ci --no-audit --no-fund
      - name: Build and check
        run: |
          npm run build:relay
          mkdir -p dist-release
          out="trek-relay-$VERSION.cjs"
          cp relay/dist/trek-relay.cjs "dist-release/$out"
          printed=$(node "dist-release/$out" version)
          [ "$printed" = "trek-relay $VERSION" ] || { echo "::error::$out says \"$printed\", not trek-relay $VERSION"; exit 1; }
          (cd dist-release && sha256sum "$out" > "$out.sha256" && cat "$out.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay
          path: dist-release/trek-relay-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    needs: [version, ci, macos-smokes, mac-app, server, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: artifacts
        run: |
          expected=("Trek-$VERSION-arm64.dmg" "trek-relay-$VERSION.cjs" "trek-relay-$VERSION.cjs.sha256")
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do expected+=("trek-server-$VERSION-$t.tar.gz"); done
          for f in "${expected[@]}"; do [ -f "$f" ] || { echo "::error::missing artifact $f"; exit 1; }; done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          **Trek $VERSION**

          - \`Trek-$VERSION-arm64.dmg\`: the desktop app for Apple silicon Macs (signed and notarized).
          - \`trek-server-$VERSION-<os>-<arch>.tar.gz\`: trek-server for macOS and Linux (x64, arm64); needs Node.js 22 or later. Unpack it and run \`bin/trek-server\` (see its README.md).
          - \`trek-relay-$VERSION.cjs\`: the push relay (\`node trek-relay-$VERSION.cjs start --config <file>\`); see relay/README.md.
          - \`SHA256SUMS\`: \`sha256sum -c SHA256SUMS\` (\`shasum -a 256 -c SHA256SUMS\` on macOS).

          The phone app is built and shipped with EAS, not here.
          EOF
          # A re-run (the draft was made, then a later step or the run failed): upload into the
          # existing draft, replacing same-named assets. A published release is never touched.
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is already published: not replacing its assets"
              exit 1
            fi
            echo "The draft release $TAG exists: uploading into it (--clobber)"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*
            exit 0
          fi
          # notes.md comes first in the release notes, then GitHub's generated ones.
          flags=(--draft --verify-tag --title "Trek $VERSION" --notes-file notes.md --generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" artifacts/*
