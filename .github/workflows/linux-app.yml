# The Linux desktop app: Trek-X.Y.Z-linux-<arch>.deb and its update feed (latest-linux.yml for x64,
# latest-linux-arm64.yml), built on a native runner per arch (Ubuntu 22.04, glibc 2.35, as the
# server tarballs), verified, installed with apt and smoke-tested (the packaged Local server and app
# smokes under xvfb). Called by release.yml; also by hand (Run workflow) to try a branch, which
# uploads the same artifacts to that run only. No secrets: the files are covered by the release's
# signed SHA256SUMS.
name: Linux app

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: Trek .deb (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            relay/package-lock.json
      # node-pty compiles from source; xvfb for the smokes. fpm, which makes the deb, is
      # electron-builder's own (fpm 1.17.0, pinned and checksummed, for linux-amd64 and
      # linux-arm64v8 alike), so no Ruby is needed here.
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb
      - run: npm ci --no-audit --no-fund
      - name: Version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Build (npm run build)
        run: npm run build
      - name: Package
        run: npx electron-builder --linux deb --${{ matrix.arch }} --publish never
      - name: Name the deb and write its feed
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(dist/*.deb)
          [ ${#debs[@]} -eq 1 ] || { echo "::error::expected one .deb in dist/, found ${#debs[@]}: ${debs[*]}"; exit 1; }
          mkdir -p dist-release
          deb="dist-release/Trek-$VERSION-linux-${{ matrix.arch }}.deb"
          mv "${debs[0]}" "$deb"
          node scripts/latest-linux-yml.mjs "$deb" "$VERSION" "${{ matrix.arch }}"
          echo "DEB=$deb" >> "$GITHUB_ENV"
          ls -l dist-release
      # Outputs are captured, then grepped from a here-string: `cmd | grep -q` under pipefail can
      # fail (or, negated, pass) when grep exits at its first match and cmd gets SIGPIPE.
      - name: Verify the package
        run: |
          set -euo pipefail
          want_arch=$([ "${{ matrix.arch }}" = x64 ] && echo amd64 || echo arm64)
          # electron-builder writes the deb's Version with every - turned into ~ (a prerelease
          # 1.2.3-rc.1 is 1.2.3~rc.1, which dpkg sorts before 1.2.3).
          want_version=${VERSION//-/\~}
          [ "$(dpkg-deb --field "$DEB" Package)" = trek ] || { echo "::error::the package is not named trek"; exit 1; }
          [ "$(dpkg-deb --field "$DEB" Version)" = "$want_version" ] || { echo "::error::the package version is not $want_version"; exit 1; }
          [ "$(dpkg-deb --field "$DEB" Architecture)" = "$want_arch" ] || { echo "::error::the package is not for $want_arch"; exit 1; }
          contents=$(dpkg-deb --contents "$DEB")
          for f in ./opt/Trek/trek ./opt/Trek/chrome-sandbox ./opt/Trek/resources/app.asar ./opt/Trek/resources/app-update.yml ./opt/Trek/resources/package-type ./opt/Trek/resources/apparmor-profile ./usr/share/applications/trek.desktop ./usr/share/mime/packages/trek.xml; do
            grep -q " $f\$" <<<"$contents" || { echo "::error::$f is missing from the deb"; exit 1; }
          done
          x=$(mktemp -d)
          dpkg-deb -x "$DEB" "$x"
          [ "$(cat "$x/opt/Trek/resources/package-type")" = deb ] || { echo "::error::package-type is not deb: the updater would not find the feed"; exit 1; }
          grep -q '^repo: trek$' "$x/opt/Trek/resources/app-update.yml" || { echo "::error::app-update.yml does not name the trek repository"; exit 1; }
          grep -q '^MimeType=.*application/x-trekproj' "$x/usr/share/applications/trek.desktop" || { echo "::error::the .desktop file does not open .trekproj"; exit 1; }
          grep -q 'type="application/x-trekproj"' "$x/usr/share/mime/packages/trek.xml" || { echo "::error::the mime package does not define application/x-trekproj"; exit 1; }
          unpacked="$x/opt/Trek/resources/app.asar.unpacked"
          ptys=$(find "$unpacked" -name pty.node)
          [ -n "$ptys" ] || { echo "::error::node-pty's pty.node is missing"; exit 1; }
          case "${{ matrix.arch }}" in x64) want_elf=x86-64 ;; arm64) want_elf=aarch64 ;; esac
          while IFS= read -r p; do
            kind=$(file -b "$p")
            echo "${p#"$unpacked/"}: $kind"
            grep -q "$want_elf" <<<"$kind" || { echo "::error::${p#"$unpacked/"} is not built for ${{ matrix.arch }}"; exit 1; }
          done <<<"$ptys"
          prebuilds=$(find "$unpacked" -path '*node-pty/prebuilds*')
          [ -z "$prebuilds" ] || { echo "::error::node-pty prebuilds for other platforms shipped: $prebuilds"; exit 1; }
      - name: Install it
        run: sudo apt-get install -y "./$DEB"
      - name: Packaged-app smokes (installed, under xvfb)
        env:
          TREK_NO_KEYRING_NOTICE: '1'
        run: |
          node scripts/local-server-smoke.mjs --packaged /opt/Trek
          xvfb-run -a node scripts/local-app-smoke.mjs --packaged /opt/Trek
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-app-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14
